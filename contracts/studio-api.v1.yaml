        - {$ref: '#/components/parameters/AgentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentServingRequest'}
      responses:
        '200':
          description: Dedicated port reassigned without rotating the existing bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentServing'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [agents]
      operationId: disableAgentServing
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '200':
          description: Serving disabled and existing bearer token revoked.
  /api/v1/agents/{agent_id}/serving/token:
    post:
      tags: [agents]
      operationId: rotateAgentServingToken
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '201':
          description: Previous token revoked and replacement returned once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentServingCredential'}
  /api/v1/agents/{agent_id}/serving/tools/{tool_id}:
    put:
      tags: [agents]
      operationId: configureAgentDirectToolServing
      description: Explicitly enable or disable the advanced direct invocation API for one Tool AI. Disabled by default.
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - name: tool_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentDirectToolServingRequest'}
      responses:
        '200':
          description: Updated Serving API exposure state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentServing'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/agents/{agent_id}/serving/data-sources:
    get:
      tags: [agents]
      operationId: listAgentServingDataSources
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '200':
          description: Tool-scoped local Task Data bindings. Raw local data is never returned.
    put:
      tags: [agents]
      operationId: upsertAgentServingDataSource
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentServingDataSourceRequest'}
      responses:
        '200':
          description: One Tool AI local Data Source was created or updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentServingDataSource'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/agents/{agent_id}/serving/data-sources/{source_id}:
    delete:
      tags: [agents]
      operationId: deleteAgentServingDataSource
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - name: source_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Data Source registration removed; local files remain untouched.}
  /api/v1/agents/{agent_id}/serving/data-sources/{source_id}/test:
    post:
      tags: [agents]
      operationId: testAgentServingDataSource
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - name: source_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sampleIndex: {type: [integer, 'null'], minimum: 0}
      responses:
        '200':
          description: Local sample adapter and Tool AI prediction result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolPredictionResponse'}
  /api/v1/agents/{agent_id}/requests:
    get:
      tags: [agents]
      operationId: listAgentRequests
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '200':
          description: Bounded local request and test records.
  /serve/v1/agents/{agent_id}/health:
    get:
      tags: [agents]
      operationId: servedAgentHealth
      security: [{AgentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '200': {description: Built Agent serving health.}
        '401': {$ref: '#/components/responses/Error'}
  /serve/v1/agents/{agent_id}/info:
    get:
      tags: [agents]
      operationId: servedAgentInfo
      security: [{AgentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '200': {description: Portable Agent and model identities.}
        '401': {$ref: '#/components/responses/Error'}
  /serve/v1/agents/{agent_id}/chat:
    post:
      tags: [agents]
      operationId: servedAgentChat
      security: [{AgentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentChatRequest'}
      responses:
        '200':
          description: Agent chat result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentChatResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /serve/v1/agents/{agent_id}/tools/{tool_id}/invoke:
    post:
      tags: [agents]
      operationId: servedAgentToolInvoke
      description: Advanced opt-in Tool AI invocation that bypasses the Base LLM and Agent Harness.
      security: [{AgentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - name: tool_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentToolPredictionRequest'}
      responses:
        '200':
          description: Direct Tool AI result without Base LLM generation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolPredictionResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /serve/v1/agents/{agent_id}/tools/{tool_id}/predict:
    post:
      tags: [agents]
      operationId: servedAgentToolPredictCompatibility
      deprecated: true
      description: Compatibility alias for the opt-in direct Tool AI invoke route.
      security: [{AgentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - name: tool_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentToolPredictionRequest'}
      responses:
        '200':
          description: Direct Tool AI result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolPredictionResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /health:
    get:
      tags: [agents]
      operationId: dedicatedServedAgentHealth
      description: Available only on an enabled Agent's dedicated localhost port.
      security: [{AgentBearer: []}]
      responses:
        '200': {description: Built Agent serving health.}
        '401': {$ref: '#/components/responses/Error'}
  /info:
    get:
      tags: [agents]
      operationId: dedicatedServedAgentInfo
      description: Available only on an enabled Agent's dedicated localhost port.
      security: [{AgentBearer: []}]
      responses:
        '200': {description: Immutable Agent build information.}
        '401': {$ref: '#/components/responses/Error'}
  /chat:
    post:
      tags: [agents]
      operationId: dedicatedServedAgentChat
      description: Available only on an enabled Agent's dedicated localhost port.
      security: [{AgentBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentChatRequest'}
      responses:
        '200':
          description: Tool AI and Base LLM response from the Agent assigned to this port.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentChatResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /tools/{tool_id}/invoke:
    post:
      tags: [agents]
      operationId: dedicatedServedAgentToolInvoke
      description: Advanced opt-in Tool AI invocation on an enabled Agent's dedicated port. This bypasses the Base LLM and Agent Harness.
      security: [{AgentBearer: []}]
      parameters:
        - name: tool_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentToolPredictionRequest'}
      responses:
        '200':
          description: Direct Tool AI result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolPredictionResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /tools/{tool_id}/predict:
    post:
      tags: [agents]
      operationId: dedicatedServedAgentToolPredictCompatibility
      deprecated: true
      description: Compatibility alias for the opt-in direct Tool AI invoke route.
      security: [{AgentBearer: []}]
      parameters:
        - name: tool_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentToolPredictionRequest'}
      responses:
        '200':
          description: Direct Tool AI result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolPredictionResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-token
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string}
    LocalProjectId:
      name: local_project_id
      in: path
      required: true
      schema: {type: string}
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema: {type: string}
    EnvironmentOwnerType:
      name: owner_type
      in: query
      required: true
      schema: {$ref: '#/components/schemas/EnvironmentOwnerType'}
    EnvironmentOwnerId:
      name: owner_id
      in: query
      required: true
      schema: {type: string}
    Handle:
      name: handle
      in: path
      required: true
      schema: {type: string}
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string}
    RuntimeKey:
      name: runtime_key
      in: path
      required: true
      schema: {type: string}
    FileId:
      name: file_id
      in: path
      required: true
      schema: {type: string}
    VersionId:
      name: version_id
      in: path
      required: true
      schema: {type: string}
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string, pattern: '^agent-[a-f0-9]{16}$'}
    ArtifactDownload:
      name: artifact
      in: query
      required: false
      description: Return verified bytes instead of a Studio-local download descriptor.
      schema: {type: boolean, default: false}
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ValidationDataset:
      type: object
      required: [dataPath, sha256, fileCount, totalBytes]
      properties:
        dataPath: {type: string, description: Task-server directory used by Campaign serverEvaluation.dataPath.}
        sha256: {type: string}
        fileCount: {type: integer}
        totalBytes: {type: integer}
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: {const: ok}
        service: {const: fedops-agent-studio-api}
        version: {type: string}
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
        code: {type: [string, 'null']}
        requestId: {type: [string, 'null']}
    Session:
      type: object
      required: [authenticated, mode, username, accountKey, handle, displayName, isGuest, isFedOps]
      properties:
        authenticated: {type: boolean}
        mode: {type: string, enum: [anonymous, fedops]}
        username: {type: [string, 'null']}
        accountKey:
          type: [string, 'null']
          description: Device-local opaque account namespace; never a FedOps user ID.
        handle: {type: [string, 'null']}
        displayName: {type: [string, 'null']}
        isGuest: {type: boolean}
        isFedOps: {type: boolean}
    AuthSessionResponse:
      type: object
      required: [status, session]
      properties:
        status: {const: success}
        session: {$ref: '#/components/schemas/Session'}
    RuntimeContract:
      type: object
      required: [name, schemaVersion]
      description: >-
        Immutable execution contract selected by FedOps Web. Tasks without a
        stored contract are treated as legacy-v1 and are never upgraded
        implicitly by Agent Studio.
      properties:
        name: {type: string, enum: [legacy-v1, federated-task-v2, federated-task-v3]}
        schemaVersion: {type: integer, enum: [1, 2, 3]}
        fedopsVersion: {type: string}
        sourceRevision: {type: string}
        baselineVersion: {type: [string, 'null']}
    TaskBinding:
      type: object
      required: [schemaVersion, taskId, runtimeKey, displayName, linkedAt]
      properties:
        schemaVersion: {type: integer, const: 1}
        taskId: {type: string}
        runtimeKey: {type: string}
        displayName: {type: string}
        workspaceRole: {type: string, enum: [owner, admin, participant]}
        taskCategory: {type: [string, 'null']}
        dataModality: {type: [string, 'null']}
        primaryModel:
          type: [object, 'null']
          additionalProperties: true
        ownerHandle: {type: [string, 'null']}
        slug: {type: [string, 'null']}
        registryStatus: {type: string}
        runtimeContract: {$ref: '#/components/schemas/RuntimeContract'}
        linkedAt: {type: string, format: date-time}
        releaseId: {type: string}
        modelVersionId: {type: string}
        bundleSha256: {type: string}
    LocalProject:
      type: object
      required: [localProjectId, name, path, origin, hasPyproject, hasFedOpsTask, projectEnvironmentReady]
      properties:
        localProjectId: {type: string}
        name: {type: string}
        path: {type: string}
        origin: {const: local}
        hasPyproject: {type: boolean}
        hasFedOpsTask: {type: boolean}
        projectEnvironmentReady: {type: boolean}
        taskBinding:
          oneOf:
            - {$ref: '#/components/schemas/TaskBinding'}
            - {type: 'null'}
    TaskRelease:
      type: object
      required: [releaseId, revision, status, bundleSha256, files, model, readiness]
      properties:
        releaseId: {type: string}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [ready, published, deprecated, rejected]}
        bundleSha256: {type: string}
        sourceFingerprint: {type: string}
        files: {type: array, items: {type: object}}
        model: {type: object}
        readiness: {type: object}
        catalog:
          type: object
          additionalProperties: true
    LegacyWorkspaceProject:
      type: object
      required: [name, path, hasPyproject, hasFedOpsTask, conflict]
      properties:
        name: {type: string}
        path: {type: string}
        hasPyproject: {type: boolean}
        hasFedOpsTask: {type: boolean}
        conflict: {type: boolean}
    LegacyWorkspaceList:
      type: object
      required: [items, source]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LegacyWorkspaceProject'}
        source: {const: device-legacy-workspace}
    LegacyWorkspaceImport:
      type: object
      required: [imported, projects]
      properties:
        imported: {type: integer, minimum: 1}
        projects:
          type: array
          items: {$ref: '#/components/schemas/LocalProject'}
    WorkspaceFileTreeNode:
      type: object
      required: [name, path, type, readOnly, accessKind]
      properties:
        name: {type: string}
        path: {type: string}
        type: {type: string, enum: [directory, file]}
        readOnly: {type: boolean}
        accessKind: {type: string, enum: [editable, generated, managed]}
        role: {type: string, nullable: true}
        children:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceFileTreeNode'}
    WorkspaceFileTree:
      type: object
      required: [project, tree]
      properties:
        project: {$ref: '#/components/schemas/LocalProject'}
        tree: {$ref: '#/components/schemas/WorkspaceFileTreeNode'}
    WorkspaceFile:
      type: object
      required: [path, name, content, language, size, modifiedAt, readOnly]
      properties:
        path: {type: string}
        name: {type: string}
        content: {type: string}
        language: {type: string}
        size: {type: integer}
        modifiedAt: {type: string, format: date-time}
        readOnly: {type: boolean}
    LocalDataBinding:
      type: object
      required: [localProjectId, containerPath, hostPath, hasEntries, fileCount, totalBytes, fingerprint, source]
      properties:
        localProjectId: {type: string}
        containerPath:
          type: string
          description: Runtime-visible path supplied to local training and participation checks.
        hostPath:
          type: string
          description: Host-visible path shown to the local user.
        hasEntries:
          type: boolean
          description: Whether the directory currently contains at least one entry.
        fileCount: {type: integer, minimum: 0}
        totalBytes: {type: integer, minimum: 0}
        fingerprint:
          type: string
          description: Stable digest of relative paths, sizes, and modification timestamps.
        source: {const: task-local-data}
    TaskDataSample:
      type: object
      required: [localProjectId, index, dataPath, payload, metadata, source]
      properties:
        localProjectId: {type: string}
        index: {type: integer, minimum: 0}
        dataPath:
          type: string
          description: Normalized path relative to the Task Data root; empty means the root.
        payload: {type: object, additionalProperties: true}
        metadata: {type: object, additionalProperties: true}
        source: {const: task-data-adapter}
    EnvironmentOwnerType:
      type: string
      enum: [federated-task, agent-build, agent-serve]
    EnvironmentOwner:
      type: object
      required: [ownerType, ownerId]
      properties:
        ownerType: {$ref: '#/components/schemas/EnvironmentOwnerType'}
        ownerId: {type: string}
    PythonEnvironment:
      type: object
      required: [environmentId, ownerType, ownerId, name, pythonVersion, path, selected, status, lockStatus, createdAt]
      properties:
        environmentId: {type: string}
        ownerType: {$ref: '#/components/schemas/EnvironmentOwnerType'}
        ownerId: {type: string}
        name: {type: string}
        pythonVersion: {type: string}
        path: {type: string}
        selected: {type: boolean}
        status: {type: string, enum: [missing, outdated, syncing, ready, error]}
        lockStatus: {type: string, enum: [missing, outdated, synced]}
        uvVersion: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        lastSyncedAt: {type: [string, 'null'], format: date-time}
        error: {type: [string, 'null']}
    PythonEnvironmentList:
      type: object
      required: [items, ownerType, ownerId, uv, source]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PythonEnvironment'}
        ownerType: {$ref: '#/components/schemas/EnvironmentOwnerType'}
        ownerId: {type: string}
        uv:
          type: object
          required: [available, version, executable]
          properties:
            available: {type: boolean}
            version: {type: [string, 'null']}
            executable: {type: [string, 'null']}
        source: {const: local-runtime-metadata}
    TaskRequirements:
      type: object
      required: [path, mode, editable, content, dependencies, valid, error, sha256]
      properties:
        path: {const: requirements.txt}
        mode: {type: string, enum: [requirements, pyproject, missing]}
        editable: {type: boolean}
        content: {type: string}
        dependencies:
          type: array
          items: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*==.+'}
        valid: {type: boolean}
        error: {type: [string, 'null']}
        sha256: {type: [string, 'null']}
    AccountTask:
      type: object
      required: [taskId, displayName]
      properties:
        taskId: {type: string}
        displayName: {type: string}
        runtimeKey: {type: [string, 'null']}
        ownerHandle: {type: [string, 'null']}
        slug: {type: [string, 'null']}
        registryStatus: {type: string}
        runtimeContract: {$ref: '#/components/schemas/RuntimeContract'}
        yamlConfig: {type: [string, 'null']}
        primaryModel:
          type: [object, 'null']
          additionalProperties: true
    RegistryTaskPermissions:
      type: object
      required: [canView, canManage, canDownloadModels, canRequestParticipation, canOpenWorkspace, isOwner, isAdmin, isParticipant]
      properties:
        canView: {type: boolean}
        canManage: {type: boolean}
        canDownloadModels: {type: boolean}
        canRequestParticipation: {type: boolean}
        canOpenWorkspace:
          type: boolean
          description: True only for the Task owner, an administrator, or an approved participant.
        isOwner: {type: boolean}
        isAdmin: {type: boolean}
        isParticipant: {type: boolean}
        participationStatus: {type: [string, 'null']}
        canLeaveParticipation: {type: boolean}
        leaveRequiresCompletedRun: {type: boolean}
        completedParticipationCount: {type: integer, minimum: 0}
        lastParticipatedAt: {type: [string, 'null'], format: date-time}
    RegistryMembership:
      type: [object, 'null']
      properties:
        role: {type: string, enum: [owner, admin, participant]}
        status: {type: string}
    RegistryTask:
      type: object
      required:
        - registryId
        - title
        - summary
        - description
        - cardMarkdown
        - tags
        - visibility
        - participationPolicy
        - status
        - modelCapability
        - permissions
      properties:
        registryId: {type: string, description: Public handle/slug identity when available.}
        taskId: {type: [string, 'null'], description: MongoDB identity; only exposed to authorized users.}
        title: {type: string}
        displayName: {type: string}
        taskCategory: {type: [string, 'null']}
        dataModality: {type: [string, 'null']}
        primaryModel:
          type: [object, 'null']
          additionalProperties: true
        runtimeKey: {type: [string, 'null'], description: Kubernetes and runtime routing identity.}
        ownerHandle: {type: [string, 'null']}
        slug: {type: [string, 'null']}
        summary: {type: string}
        description: {type: string}
        cardMarkdown: {type: string}
        tags:
          type: array
          items: {type: string}
        visibility: {type: string, enum: [public, private]}
        participationPolicy: {type: string, enum: [closed, approval_required, open]}
        status: {type: string}
        dataType: {type: [string, 'null']}
        modelType: {type: [string, 'null']}
        modelCapability:
          type: string
          enum: [base-llm, tool-ai]
          description: Agent composition role inferred from authoritative Task model metadata.
        strategy: {type: [string, 'null']}
        numRounds: {type: [string, 'null']}
        publishedAt: {type: [string, 'null']}
        registryStatus: {type: string}
        runtimeContract: {$ref: '#/components/schemas/RuntimeContract'}
        currentPublishedReleaseId: {type: [string, 'null']}
        updatedAt: {type: [string, 'null']}
        membership: {$ref: '#/components/schemas/RegistryMembership'}
        permissions: {$ref: '#/components/schemas/RegistryTaskPermissions'}
    RegistryTaskList:
      type: object
      required: [items, view, page, source]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RegistryTask'}
        view: {type: string, enum: [public, all, owned, joined]}
        page: {type: integer}
        source: {const: fedops-web}
    TaskMetric:
      type: object
      properties:
        round: {type: [integer, 'null']}
        modelVersion: {type: [integer, 'null']}
        loss: {type: [number, 'null']}
        accuracy: {type: [number, 'null']}
        roundTimeSeconds: {type: [number, 'null']}
    TaskActivity:
      type: object
      required: [schemaVersion, run, participants, metrics, source]
      properties:
        schemaVersion: {type: integer}
        run:
          type: object
          additionalProperties: true
        participants:
          type: object
          additionalProperties: true
        metrics:
          type: object
          required: [latest, history]
          properties:
            latest:
              anyOf:
                - {$ref: '#/components/schemas/TaskMetric'}
                - {type: 'null'}
            history:
              type: array
              items: {$ref: '#/components/schemas/TaskMetric'}
        membership:
          type: [object, 'null']
          additionalProperties: true
        source:
          type: object
          additionalProperties: true
    TaskHub:
      type: object
      required: [task, permissions, models, files, usage]
      properties:
        task: {type: object, additionalProperties: true}
        permissions: {$ref: '#/components/schemas/RegistryTaskPermissions'}
        models:
          type: array
          items: {type: object, additionalProperties: true}
        files:
          type: array
