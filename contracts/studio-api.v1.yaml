openapi: 3.1.0
info:
  title: FedOps Agent Studio Local API
  version: 0.1.0
  description: >-
    Versioned contract between studio-web, the Python Studio API, and FedOps Web.
    Paths marked x-implementation planned are contract targets and must be
    implemented with contract tests before a product screen can enable them.
servers:
  - url: http://localhost:24368
tags:
  - name: system
  - name: auth
  - name: workspace
  - name: environments
  - name: registry
  - name: federation
  - name: agent-builder
  - name: agents
paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        '200':
          description: API is ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/v1/bootstrap:
    get:
      tags: [system]
      operationId: getBootstrap
      responses:
        '200':
          description: Session, local projects, and available capabilities.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bootstrap'}
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Authenticated local session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      responses:
        '200':
          description: Current local session or anonymous state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '200':
          description: Local session removed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: success}
  /api/v1/workspaces:
    get:
      tags: [workspace]
      operationId: listWorkspaces
      responses:
        '200':
          description: Local Federated Task projects.
          content:
            application/json:
              schema:
                type: object
                required: [items, source]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LocalProject'}
                  source: {const: local-runtime}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [workspace]
      operationId: createWorkspace
      description: >-
        Opens an owned FedOps Web Draft using its existing identity, or creates
        an account-scoped local-first project with a user-provided local project
        name. Both flows install the immutable default Baseline release bundled
        and directly served by FedOps Web. Agent Studio never clones or pulls a
        Git repository while serving this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [sourceTaskId]
                  properties:
                    sourceTaskId: {type: string, minLength: 1}
                - required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 64}
              properties:
                name: {type: [string, 'null'], minLength: 1, maxLength: 64}
                sourceTaskId: {type: [string, 'null']}
                sourceModelVersion: {type: [string, 'null']}
      responses:
        '202':
          description: >-
            The authenticated Baseline download, checksum verification, shared
            device cache installation, and project copy completed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/legacy:
    get:
      tags: [workspace]
      operationId: listLegacyWorkspaces
      description: >-
        First-level projects left by the former device-wide Workspace. They are
        never assigned to an account automatically.
      responses:
        '200':
          description: Legacy projects and conflicts for the current account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyWorkspaceList'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/legacy/import:
    post:
      tags: [workspace]
      operationId: importLegacyWorkspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectNames]
              properties:
                projectNames:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, minLength: 1}
      responses:
        '200':
          description: Selected legacy projects moved into the current account Workspace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyWorkspaceImport'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/registry/account-tasks:
    get:
      tags: [registry]
      operationId: listCurrentAccountTasks
      description: >-
        Compatibility projection of the existing FedOps Web account Task API.
        This is not yet the Global Model Registry API.
      responses:
        '200':
          description: Current account Tasks with stable and runtime IDs separated.
          content:
            application/json:
              schema:
                type: object
                required: [items, source]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AccountTask'}
                  source: {const: fedops-web-account-tasks}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/actions:
    post:
      tags: [workspace]
      operationId: startWorkspaceAction
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [validate, local-train, release-readiness, participation-readiness, run-file]
                environmentId: {type: [string, 'null']}
                filePath: {type: [string, 'null']}
                dataPath: {type: [string, 'null']}
      responses:
        '202':
          description: Managed local run started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/binding:
    put:
      tags: [workspace]
      operationId: linkWorkspaceToWebDraft
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId: {type: string, minLength: 1}
      responses:
        '200':
          description: Local Workspace bound to one owner-managed Web Draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskBinding'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/release-candidate:
    post:
      tags: [workspace]
      operationId: submitReleaseCandidate
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      responses:
        '202':
          description: Background upload of the Initial Model and immutable Release started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/release-submission-readiness:
    get:
      tags: [workspace]
      operationId: getReleaseSubmissionReadiness
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      responses:
        '200':
          description: Whether the current Workspace source and exported model still match a successful Release Readiness check.
          content:
            application/json:
              schema:
                type: object
                required: [ready, reason]
                properties:
                  ready: {type: boolean}
                  reason: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}:
    delete:
      tags: [workspace]
      operationId: deleteWorkspace
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Local project source and environments were deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, localProjectId, name]
                properties:
                  deleted: {const: true}
                  localProjectId: {type: string}
                  name: {type: string}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/open-folder:
    post:
      tags: [workspace]
      operationId: openWorkspaceFolder
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      responses:
        '200':
          description: The project directory was opened in the host file manager.
          content:
            application/json:
              schema:
                type: object
                required: [opened, path, mode]
                properties:
                  opened: {const: true}
                  path: {type: string}
                  mode: {type: string, enum: [native, host-bridge]}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/validation-data:
    get:
      tags: [workspace]
      operationId: getValidationData
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      responses:
        '200':
          description: Owner-only, separate local validation folder and server dataset inventory. No raw files returned.
          content:
            application/json:
              schema:
                type: object
                required: [local, items]
                properties:
                  local: {$ref: '#/components/schemas/LocalDataBinding'}
                  items: {type: array, items: {$ref: '#/components/schemas/ValidationDataset'}}
                  serverError: {type: string}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [workspace]
      operationId: uploadValidationData
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent, relativePath]
              properties:
                consent: {type: boolean, const: true}
                relativePath: {type: string, description: Subdirectory of the dedicated validation folder; empty selects its root.}
      responses:
        '200':
          description: Immutable dataset uploaded to this Task server. Campaign selection and evaluation check are separate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationDataset'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/open-validation-folder:
    post:
      tags: [workspace]
      operationId: openValidationFolder
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      responses:
        '200':
          description: Opens the separate account-local validation folder, never the training folder.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalDataBinding'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/data-binding:
    put:
      tags: [workspace]
      operationId: prepareWorkspaceDataBinding
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      responses:
        '200':
          description: >-
            Account- and Task-scoped local data directory prepared outside the
            releaseable Workspace source tree.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalDataBinding'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/open-data-folder:
    post:
      tags: [workspace]
      operationId: openWorkspaceDataFolder
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      responses:
        '200':
          description: The Task-local dataset directory was opened in the host file manager.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/LocalDataBinding'}
                  - type: object
                    required: [opened, mode]
                    properties:
                      opened: {const: true}
                      mode: {type: string, enum: [native, host-bridge]}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{local_project_id}/task-data/sample:
    post:
      tags: [workspace]
      operationId: buildWorkspaceTaskDataSample
      parameters:
        - {$ref: '#/components/parameters/LocalProjectId'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                index: {type: integer, minimum: 0, default: 0}
                dataPath:
                  type: string
                  maxLength: 512
                  default: ''
                  description: >-
                    Optional file or directory path relative to the Task Data
                    root. An empty value selects the complete Task Data root.
      responses:
        '200':
          description: >-
            JSON-safe inference payload produced from the same local-only Task
            Data directory used by local and federated training.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDataSample'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/runs:
    get:
      tags: [workspace]
      operationId: listWorkspaceRuns
      description: Process-local action history for the current Studio runtime session.
      parameters:
        - name: local_project_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Managed Workspace runs.
          content:
            application/json:
              schema:
                type: object
                required: [items, source]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Run'}
                  source: {const: local-runtime-session}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/runs/{run_id}:
    get:
      tags: [workspace]
      operationId: getWorkspaceRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current state and bounded output of a managed Workspace run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/runs/{run_id}/cancel:
    post:
      tags: [workspace]
      operationId: cancelWorkspaceRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Stop requested for an active managed Workspace run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/environments:
    get:
      tags: [environments]
      operationId: listPythonEnvironments
      parameters:
        - {$ref: '#/components/parameters/EnvironmentOwnerType'}
        - {$ref: '#/components/parameters/EnvironmentOwnerId'}
      responses:
        '200':
          description: Durable uv environment metadata for one owner.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PythonEnvironmentList'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [environments]
      operationId: createPythonEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerType, ownerId, name, pythonVersion]
              properties:
                ownerType: {$ref: '#/components/schemas/EnvironmentOwnerType'}
                ownerId: {type: string}
                name: {type: string, minLength: 1, maxLength: 48}
                pythonVersion: {type: string, pattern: '^3\\.(10|11|12|13|14)$'}
                select: {type: boolean, default: true}
      responses:
        '201':
          description: Environment metadata created; sync is a separate action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PythonEnvironment'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/environments/{environment_id}/select:
    post:
      tags: [environments]
      operationId: selectPythonEnvironment
      parameters:
        - {$ref: '#/components/parameters/EnvironmentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvironmentOwner'}
      responses:
        '200':
          description: Selected environment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PythonEnvironment'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/environments/requirements:
    get:
      tags: [environments]
      operationId: getTaskRequirements
      parameters:
        - {$ref: '#/components/parameters/EnvironmentOwnerType'}
        - {$ref: '#/components/parameters/EnvironmentOwnerId'}
      responses:
        '200':
          description: Canonical Task dependency authoring contract.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRequirements'}
        '422': {$ref: '#/components/responses/Error'}
    put:
      tags: [environments]
      operationId: updateTaskRequirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerType, ownerId, content]
              properties:
                ownerType: {$ref: '#/components/schemas/EnvironmentOwnerType'}
                ownerId: {type: string}
                content: {type: string, maxLength: 131072}
      responses:
        '200':
          description: requirements.txt saved and environments marked outdated by content identity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRequirements'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/environments/{environment_id}:
    delete:
      tags: [environments]
      operationId: deletePythonEnvironment
      parameters:
        - {$ref: '#/components/parameters/EnvironmentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvironmentOwner'}
      responses:
        '200':
          description: Environment directory deleted and remaining metadata returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PythonEnvironmentList'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/environments/{environment_id}/sync:
    post:
      tags: [environments]
      operationId: syncPythonEnvironment
      parameters:
        - {$ref: '#/components/parameters/EnvironmentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvironmentOwner'}
      responses:
        '202':
          description: uv sync run started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/files/tree:
    get:
      tags: [workspace]
      operationId: getWorkspaceFileTree
      parameters:
        - name: local_project_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Actual file tree scoped to one discovered local project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceFileTree'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/files/content:
    get:
      tags: [workspace]
      operationId: readWorkspaceFile
      parameters:
        - name: local_project_id
          in: query
          required: true
          schema: {type: string}
        - name: file_path
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: UTF-8 file content from the selected local project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceFile'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
    put:
      tags: [workspace]
      operationId: saveWorkspaceFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localProjectId, filePath, content]
              properties:
                localProjectId: {type: string}
                filePath: {type: string}
                content: {type: string}
      responses:
        '200':
          description: Existing file saved inside the selected local project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceFile'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
    post:
      tags: [workspace]
      operationId: createWorkspaceFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localProjectId, filePath]
              properties:
                localProjectId: {type: string}
                filePath: {type: string}
                content: {type: string, default: ''}
      responses:
        '201':
          description: New UTF-8 file created inside the selected local project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceFile'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
    delete:
      tags: [workspace]
      operationId: deleteWorkspaceFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localProjectId, filePath]
              properties:
                localProjectId: {type: string}
                filePath: {type: string}
      responses:
        '200':
          description: Existing file deleted inside the selected local project.
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/files/format:
    post:
      tags: [workspace]
      operationId: formatWorkspaceFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localProjectId, filePath]
              properties:
                localProjectId: {type: string}
                filePath: {type: string}
      responses:
        '200':
          description: Python or JSON file formatted by the Studio Runtime.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceFile'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/terminal/session:
    post:
      tags: [workspace]
      operationId: ensureWorkspaceTerminal
      responses:
        '200':
          description: Local Python Runtime PTY is ready for an authenticated Socket.IO client.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ready}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/registry/tasks:
    get:
      tags: [registry]
      operationId: listRegistryTasks
      parameters:
        - name: view
          in: query
          schema: {type: string, enum: [public, all, owned, joined], default: public}
        - name: q
          in: query
          schema: {type: string}
        - name: model_type
          in: query
          schema: {type: string}
        - name: tag
          in: query
          schema: {type: string}
        - name: page
          in: query
