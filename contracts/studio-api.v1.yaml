        percent: {type: number, minimum: 0, maximum: 100}
        message: {type: string}
        timestamp: {type: string, format: date-time}
        epoch: {type: [integer, 'null'], minimum: 1}
        epochs: {type: [integer, 'null'], minimum: 1}
        batch: {type: [integer, 'null'], minimum: 1}
        totalBatches: {type: [integer, 'null'], minimum: 1}
        step:
          type: [integer, 'null']
          minimum: 0
          description: Optional zero- or one-based local progress step when the Task has no batch concept.
        totalSteps: {type: [integer, 'null'], minimum: 1}
        metrics:
          type: object
          additionalProperties: {type: number}
    TrainingMetricPoint:
      type: object
      required: [timestamp, stage, percent, metrics]
      properties:
        timestamp: {type: string, format: date-time}
        stage: {type: string}
        percent: {type: number, minimum: 0, maximum: 100}
        epoch: {type: [integer, 'null']}
        epochs: {type: [integer, 'null']}
        batch: {type: [integer, 'null']}
        totalBatches: {type: [integer, 'null']}
        step: {type: [integer, 'null'], minimum: 0}
        totalSteps: {type: [integer, 'null']}
        metrics:
          type: object
          additionalProperties: {type: number}
    Capabilities:
      type: object
      additionalProperties: {type: boolean}
    HardwareGpuDevice:
      type: object
      required: [name, memoryBytes, computeUnits]
      properties:
        name: {type: string}
        memoryBytes: {type: [integer, 'null'], minimum: 0}
        computeUnits: {type: [integer, 'null'], minimum: 0}
    HardwareInformation:
      type: object
      required: [source, platform, cpu, memory, gpu]
      properties:
        source: {type: string, enum: [host, runtime]}
        platform:
          type: object
          required: [system, release, architecture]
          properties:
            system: {type: string}
            release: {type: string}
            architecture: {type: string}
        cpu:
          type: object
          required: [model, logicalCores]
          properties:
            model: {type: string}
            logicalCores: {type: integer, minimum: 1}
        memory:
          type: object
          required: [totalBytes]
          properties:
            totalBytes: {type: integer, minimum: 0}
        gpu:
          type: object
          required: [detected, devices]
          properties:
            detected: {type: boolean}
            devices:
              type: array
              items: {$ref: '#/components/schemas/HardwareGpuDevice'}
    Bootstrap:
      type: object
      required: [version, connections, session, workspace, hardware, capabilities]
      properties:
        version: {type: string}
        connections:
          type: object
          required: [fedopsWeb, fedopsRegister]
          properties:
            fedopsWeb: {type: string, format: uri}
            fedopsRegister: {type: string, format: uri}
        session: {$ref: '#/components/schemas/Session'}
        workspace:
          type: object
          required: [root, displayRoot, projects, legacyProjects, projectDiscovery]
          properties:
            root: {type: string}
            displayRoot: {type: string}
            projects:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/LocalProject'}
            legacyProjects:
              type: array
              items: {$ref: '#/components/schemas/LegacyWorkspaceProject'}
            projectDiscovery: {type: string}
        hardware: {$ref: '#/components/schemas/HardwareInformation'}
        capabilities: {$ref: '#/components/schemas/Capabilities'}
