[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fedops-agent-studio-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "python-socketio",
  "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
